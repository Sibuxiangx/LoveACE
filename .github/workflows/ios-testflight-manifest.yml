name: iOS TestFlight Manifest

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and print the document without writing to S3
        required: true
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: S3
    concurrency:
      group: loveace-manifest-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish iOS TestFlight manifest
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          CDN_BASE_URL: https://release.loveace.top
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(ios-testflight-publish)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          uv run python cli.py "${args[@]}"
        working-directory: utils/manifest_v2
