name: Build Linux AppImage

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only; do not publish OTA or GitHub Release assets
        required: false
        default: true
        type: boolean
      changelog:
        description: Release changelog
        required: false
        default: ""
        type: string
      content:
        description: OTA dialog content
        required: false
        default: ""
        type: string
      force:
        description: Force OTA update
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev

      - name: Read desktop version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path('desktop/pubspec.yaml').read_text()
          match = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)', text, re.MULTILINE)
          if not match:
              raise SystemExit('Cannot read version from desktop/pubspec.yaml')

          version = match.group(1)
          build = match.group(2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'build={build}\n')
              output.write(f'artifact_name=loveace-linux-{version}-{build}\n')
          print(f'Desktop version: {version} ({build})')
          PY

      - name: Get dependencies
        run: flutter pub get
        working-directory: desktop

      - name: Analyze desktop project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: desktop

      - name: Build AppImage
        env:
          ANALYTICS_ENDPOINT: https://analyst-api.linota.cn/v1/events
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}
          ANALYTICS_SIGNING_SECRET: ${{ secrets.ANALYTICS_SIGNING_SECRET }}
          ANALYTICS_HASH_SALT: ${{ secrets.ANALYTICS_HASH_SALT }}
        run: ./desktop/appimage/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: desktop/build/appimage/LoveACE-${{ steps.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

      - name: Confirm dry run
        run: |
          echo "Dry run: ${{ inputs.dry_run }}"
          echo "OTA/manifest publishing is skipped when dry_run is true."

  upload-manifest:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.dry_run == false }}
    environment: S3
    concurrency:
      group: loveace-manifest-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download AppImage artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./appimage

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish Linux release
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          CDN_BASE_URL: https://release.loveace.top
        run: |
          uv run python cli.py release \
            --version "${{ needs.build.outputs.version }}" \
            --build "${{ needs.build.outputs.build }}" \
            --platform linux \
            --arch x86_64 \
            --file "../../appimage/LoveACE-${{ needs.build.outputs.version }}-x86_64.AppImage" \
            --content "${{ inputs.content }}" \
            --changelog "${{ inputs.changelog }}" \
            ${{ inputs.force && '--force' || '' }}
        working-directory: utils/manifest_v2
