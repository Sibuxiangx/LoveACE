name: Manifest Announce

on:
  workflow_dispatch:
    inputs:
      command:
        description: >-
          Arguments for utils/manifest_v2 cli.py, e.g.
          announce -t "标题" -c "内容" --platform android --level warning --confirm
          Only announce and clear-announce are allowed.
        required: true
        type: string

jobs:
  announce:
    runs-on: ubuntu-latest
    environment: S3
    concurrency:
      group: loveace-manifest-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run announce command
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          CDN_BASE_URL: https://release.loveace.top
          CLI_ARGS: ${{ inputs.command }}
        run: |
          set -euo pipefail
          # Split the command like a shell would, without executing any shell syntax.
          mapfile -t ARGS < <(python3 -c 'import os, shlex; print("\n".join(shlex.split(os.environ["CLI_ARGS"])))')
          if [ "${#ARGS[@]}" -eq 0 ]; then
            echo "empty command" >&2
            exit 1
          fi
          case "${ARGS[0]}" in
            announce|clear-announce) ;;
            *)
              echo "Only announce and clear-announce are allowed, got: '${ARGS[0]}'" >&2
              exit 1
              ;;
          esac
          uv run python cli.py "${ARGS[@]}"
        working-directory: utils/manifest_v2
