name: smart_ui
description: 智能排课 page of the LoveACE desktop app, shown in a webview window.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  fluent_ui: ^4.15.1
  provider: ^6.1.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Medium.otf
